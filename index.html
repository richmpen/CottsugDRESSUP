<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#fbd5e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Милая одевашка от COTTSUG — наряди клубничную девочку 🍓 t.me/cottsug">
<title>COTTSUG · Одевашка 🍓</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Nunito:ital,wght@0,400;0,700;0,800;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍓</text></svg>">
</head>
<body>

<!-- ══════════ ФОНОВЫЙ ДЕКОР ══════════ -->
<div class="decor" aria-hidden="true">
  <div class="decor__grid"></div>
  <svg class="berry berry--a" viewBox="0 0 100 120"><use href="#berry-outline"/></svg>
  <svg class="berry berry--b" viewBox="0 0 100 120"><use href="#berry-outline"/></svg>
  <svg class="berry berry--c" viewBox="0 0 100 120"><use href="#berry-outline"/></svg>
  <span class="spark spark--1">✦</span>
  <span class="spark spark--2">✧</span>
  <span class="spark spark--3">✦</span>
  <span class="spark spark--4">✧</span>
  <span class="spark spark--5">✦</span>
  <span class="spark spark--6">✧</span>

  <!-- медленно всплывающие клубнички -->
  <div class="floaties">
    <span style="--l:6%;  --dur:19s; --dl:-2s;  --sz:22px">🍓</span>
    <span style="--l:17%; --dur:24s; --dl:-9s;  --sz:14px">✦</span>
    <span style="--l:29%; --dur:21s; --dl:-14s; --sz:18px">🎀</span>
    <span style="--l:41%; --dur:26s; --dl:-5s;  --sz:13px">💗</span>
    <span style="--l:55%; --dur:18s; --dl:-11s; --sz:20px">🍓</span>
    <span style="--l:68%; --dur:23s; --dl:-3s;  --sz:15px">🌸</span>
    <span style="--l:79%; --dur:27s; --dl:-16s; --sz:24px">🍓</span>
    <span style="--l:91%; --dur:20s; --dl:-7s;  --sz:16px">✧</span>
  </div>
</div>

<!-- спрайты -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <symbol id="berry-outline" viewBox="0 0 100 120">
    <path d="M50 30c22 0 38 16 38 36 0 26-22 48-38 48S12 92 12 66c0-20 16-36 38-36z"
          fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M50 32c0-10 6-18 14-22-2 8 0 14 4 18-8-2-14 0-18 4z"
          fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="38" cy="62" r="2.6" fill="currentColor"/><circle cx="58" cy="58" r="2.6" fill="currentColor"/>
    <circle cx="48" cy="78" r="2.6" fill="currentColor"/><circle cx="66" cy="78" r="2.6" fill="currentColor"/>
    <circle cx="34" cy="84" r="2.6" fill="currentColor"/>
  </symbol>
  <symbol id="tg" viewBox="0 0 24 24">
    <path fill="currentColor" d="M21.9 4.3 18.7 19c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.3-4.9 9-8.1c.4-.3-.1-.5-.6-.2L6.2 12.8 1.4 11.3c-1-.3-1-1 .2-1.5l19-7.3c.9-.3 1.6.2 1.3 1.8z"/>
  </symbol>
</svg>

<div class="app" id="app">

  <!-- ══════════ ШАПКА ══════════ -->
  <header class="topbar">
    <div class="brand">
      <div class="brand__logo">
        <span class="brand__word">COT<span class="brand__heart">♥</span>TSUG</span>
        <a class="brand__tag" href="https://t.me/cottsug" target="_blank" rel="noopener">
          <svg class="brand__tgi" viewBox="0 0 24 24"><use href="#tg"/></svg>@COTTSUG
        </a>
      </div>
    </div>

    <nav class="tools" aria-label="Инструменты">
      <a class="tool tool--tg" href="https://t.me/cottsug" target="_blank" rel="noopener" title="Телеграм-канал @cottsug">
        <svg class="tool__tgi" viewBox="0 0 24 24"><use href="#tg"/></svg><b>@cottsug</b>
      </a>
      <button class="tool" id="btnRandom" title="Случайный образ (R)"><span>🎲</span><b>Рандом</b></button>
      <button class="tool" id="btnClear"  title="Снять всё (C)"><span>🧺</span><b>Снять всё</b></button>
      <button class="tool" id="btnShot"   title="Скачать картинку (S)"><span>📸</span><b>Сохранить</b></button>
      <button class="tool tool--icon" id="btnSound" title="Звук" aria-pressed="true"><span id="soundIcon">🔔</span></button>
    </nav>
  </header>

  <!-- ══════════ ОСНОВНОЕ ══════════ -->
  <main class="layout">

    <!-- ─── ПЕРСОНАЖ ─── -->
    <section class="doll" aria-label="Персонаж">
      <div class="doll__card">
        <span class="doll__corner doll__corner--tl">✦</span>
        <span class="doll__corner doll__corner--tr">✦</span>
        <span class="doll__corner doll__corner--bl">✦</span>
        <span class="doll__corner doll__corner--br">✦</span>
        <span class="doll__mascot" aria-hidden="true">🍓</span>

        <div class="stage" id="stage">
          <div class="stage__inner" id="stageInner">
            <img class="layer layer--base" id="baseImg" alt="Персонаж" draggable="false">
            <!-- слои одежды добавляются скриптом -->
          </div>
          <div class="guides" id="guides" aria-hidden="true"></div>
        </div>

        <div class="doll__loader" id="loader"><i></i><i></i><i></i></div>
      </div>

      <div class="worn" id="worn" aria-label="Надето"></div>
    </section>

    <!-- ─── ГАРДЕРОБ ─── -->
    <aside class="wardrobe" id="wardrobe" aria-label="Гардероб">
      <button class="wardrobe__grip" id="grip" aria-label="Свернуть/развернуть гардероб"><i></i></button>

      <div class="wardrobe__head">
        <h2 class="wardrobe__title">Гардероб <em id="wardrobeCount"></em></h2>
        <a class="wardrobe__tg" href="https://t.me/cottsug" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><use href="#tg"/></svg>@cottsug
        </a>
      </div>

      <div class="tabs" id="tabs" role="tablist"></div>

      <div class="shelf" id="shelf" role="tabpanel"></div>
    </aside>
  </main>

  <!-- мобильная нижняя ручка -->
  <button class="fab" id="fab" aria-label="Открыть гардероб">
    <span>👗</span><b>Гардероб</b>
  </button>
</div>

<!-- ══════════ БЕТА-ПАНЕЛЬ ══════════ -->

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas id="shotCanvas" hidden></canvas>

<script src="js/catalog.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
